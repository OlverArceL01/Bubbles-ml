[project]
name = "bubbles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "OlverArceL01", email = "olverarcedev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "python-multipart>=0.0.32",
    "ultralytics>=8.4.174",
    "uvicorn[standard]>=0.54.0",
    "numpy>=2.4.6",
    "matplotlib>=3.11.2",
    "pillow>=12.3.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1"
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pandas>=3.0.6",
    "seaborn>=0.13.2"
]

[project.scripts]
bubbles = "bubbles:main"
train = "bubbles.train:main"
serve = "bubbles.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"


[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true